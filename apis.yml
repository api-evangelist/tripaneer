name: tripaneer
description: >-
  tripaneer is an Amsterdam-based online travel company that operates a family
  of themed wellness and activity travel marketplaces, connecting travelers with
  the organizers of retreats, courses, and holidays around the world. Its brands
  include BookYogaRetreats.com, BookSurfCamps.com, BookMeditationRetreats.com,
  BookAdventureRetreats.com, BookFitnessHolidays.com, BookMartialArtsHolidays.com,
  and BookSailingHolidays.com, among others. Each site lets travelers discover,
  compare, and book multi-day experiences by theme, destination, price, and date,
  while giving retreat and course organizers a channel to list and sell their
  offerings. tripaneer was surfaced as a portfolio company of Point Nine and
  added to the API Evangelist network. As of this enrichment pass the company
  publishes a consumer travel marketplace (sitemaps for listings, organizers, and
  a blog) but exposes no public developer API, OpenAPI, OAuth/OIDC discovery, or
  developer-portal surface that could be found or probed.
